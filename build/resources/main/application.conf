ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
    }
    
    application {
        modules = [ com.financeflow.ApplicationKt.module ]
    }
    
    database {
        driver = "org.postgresql.Driver"
        url = "jdbc:postgresql://localhost:5432/financeflow"
        user = "postgres"
        password = "postgres"
        maxPoolSize = 10
    }
    
    jwt {
        secret = "your_jwt_secret_key_should_be_long_and_secure"
        issuer = "financeflow-api"
        audience = "financeflow-app"
        realm = "financeflow"
        expiration = 86400000 // 24 hours
    }
}
