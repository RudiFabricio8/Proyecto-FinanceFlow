name: Deploy Java App to Amazon EC2

on:
  push:
    branches:
      - main
      - API
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama a desplegar'
        required: true
        default: 'API'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup on jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle and Shadowjar
        # Ajuste: Usamos buildFatJar si es Ktor, o shadowJar si usas el plugin shadow
        run: ./gradlew clean buildFatJar

      - name: Move JAR to root for SCP
        id: move_jar
        run: |
          # Buscamos cualquier JAR dentro de build/libs (ajusta la ruta si tu proyecto tiene submodulos)
          # Nota: Quitamos "app/" del inicio por si tu estructura es plana
          JAR_FULL_PATH=$(find build/libs -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          
          if [ -z "$JAR_FULL_PATH" ]; then
            echo "::error::No se encontró ningún archivo .jar"
            exit 1
          fi

          echo "JAR encontrado: $JAR_FULL_PATH"
          
          # Lo renombramos a app.jar para que sea facil de ejecutar en el servidor
          mv "$JAR_FULL_PATH" app.jar
          echo "moved_jar_filename=app.jar" >> $GITHUB_OUTPUT

      - name: Stop old app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            # Detenemos el servicio si existe, si falla no importa (|| true)
            sudo systemctl stop financeflow || true
            # Limpiamos la carpeta de destino
            rm -f /opt/apps/backend/*.jar

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "app.jar"
          target: "/opt/apps/backend/"

      - name: Start app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            # Reiniciamos el servicio
            sudo systemctl restart financeflow
            # Verificamos estatus (opcional, solo para log)
            sudo systemctl status financeflow --no-pager