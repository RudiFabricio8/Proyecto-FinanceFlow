<div class="logout-modal__backdrop">
  <div class="logout-modal__card">
    <div class="logout-modal__icon">
      <!-- Icono de advertencia simple -->
      <span>!</span>
    </div>
    <h2>Cerrar Sesión</h2>
    <p>¿Estás seguro de que deseas cerrar tu sesión?</p>

    <div class="logout-modal__actions">
      <button type="button" class="btn btn--secondary" (click)="onCancel()">Cancelar</button>
      <button type="button" class="btn btn--primary" (click)="onConfirm()">Cerrar Sesión</button>
    </div>
  </div>
</div>
