<div class="receipts-container">
  <header class="receipts-header">
    <h1 class="receipts-title">Recibos y Documentos</h1>
    
    <input type="file" id="fileInput" (change)="onFileSelected($event)" style="display: none">
    <button class="upload-btn" (click)="triggerFileInput()">
      <i class="bi bi-upload"></i>
      Subir Archivo
    </button>
  </header>

  <div class="documents-grid" *ngIf="!loading">
    <app-receipt-card
      *ngFor="let doc of documents"
      [document]="doc">
    </app-receipt-card>
    
    <div *ngIf="documents.length === 0" class="no-documents">
      <i class="bi bi-inbox"></i>
      <p>No hay documentos cargados.</p>
      <p class="no-documents-hint">Sube tu primer documento usando el botón "Subir Archivo"</p>
    </div>
  </div>

  <div *ngIf="loading" class="loading-state">
    <p>Cargando documentos...</p>
  </div>
</div>
