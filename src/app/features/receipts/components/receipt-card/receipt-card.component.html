<div class="receipt-card">
  <div class="receipt-card__header">
    <h3 class="receipt-card__title">{{ title }}</h3>
    <span class="receipt-card__date">{{ date }}</span>
  </div>
  <div class="receipt-card__body">
    <p class="receipt-card__provider">
      <strong>Proveedor:</strong> {{ provider }}
    </p>
    <p class="receipt-card__amount">
      <strong>Monto:</strong> {{ amount }}
    </p>
  </div>
  <div class="receipt-card__footer">
    <button class="receipt-card__btn">Ver detalles</button>
  </div>
</div>
