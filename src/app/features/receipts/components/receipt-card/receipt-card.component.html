<div class="receipt-card">
  <div class="card-icon">
    <i [class]="getDocumentIcon()"></i>
  </div>
  <div class="card-content">
    <h3 class="card-title">{{ document.title || document.filename }}</h3>
    <div class="card-details">
      <p class="card-date">
        <strong>Fecha:</strong> {{ formatDate(document.date || document.uploadedAt) }}
      </p>
      <p class="card-amount">
        <strong>Monto:</strong> {{ formatAmount(document.amount) }}
      </p>
      <p class="card-provider" *ngIf="document.provider">
        <strong>Proveedor:</strong> {{ document.provider }}
      </p>
    </div>
  </div>
</div>
