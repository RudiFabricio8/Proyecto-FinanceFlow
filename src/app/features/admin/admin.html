<div class="admin-container">
  <div class="header">
    <h1>Administración de Nómina</h1>
    <p>Gestión de cumplimiento y reportes</p>
  </div>

  <div class="content-grid">
    <div class="sidebar">
      <app-period-selector
        [periods]="periods"
        [selectedPeriodId]="selectedPeriod?.id || ''"
        (periodSelected)="onPeriodSelected($event)">
      </app-period-selector>
    </div>

    <div class="main-section" *ngIf="selectedPeriod">
      <app-compliance-table
        [records]="dailyRecords"
        [selectedPeriod]="selectedPeriod.month + ' ' + selectedPeriod.year"
        (statusChange)="onStatusChange($event)"
        (export)="onExport()">
      </app-compliance-table>
    </div>
    
    <div class="main-section" *ngIf="!selectedPeriod">
      <p class="no-selection">Seleccione un período para ver los detalles.</p>
    </div>
  </div>
</div>
