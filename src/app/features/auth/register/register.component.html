<section class="register">
  <h1>Crea tu Cuenta</h1>
  <p class="lead">Únete a nosotros para gestionar tus finanzas eficientemente.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <label for="company">Nombre de la Empresa</label>
      <input id="company" type="text" formControlName="company" placeholder="Tu Empresa S.A." />
      <small *ngIf="f['company'].touched && f['company'].invalid">Ingresa un nombre válido (mín. 2 caracteres).</small>
    </div>

    <div>
      <label for="email">Correo Electrónico</label>
      <input id="email" type="email" formControlName="email" placeholder="tu@ejemplo.com" />
      <small *ngIf="f['email'].touched && f['email'].invalid">Correo inválido.</small>
    </div>

    <div>
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" placeholder="Ingresa tu contraseña" />
      <small *ngIf="f['password'].touched && f['password'].invalid">Mínimo 6 caracteres.</small>
    </div>

    <div>
      <label for="confirm">Confirmar Contraseña</label>
      <input id="confirm" type="password" formControlName="confirm" placeholder="Confirma tu contraseña" />
      <small *ngIf="form.touched && form.errors?.['mismatch']">Las contraseñas no coinciden.</small>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="submitting">Registrarse</button>
    </div>

    <p *ngIf="errorMsg" style="color: #d32f2f; margin-top: 1rem; text-align: center;">{{ errorMsg }}</p>
    
    <p style="text-align: center; margin-top: 1.5rem; color: #666;">
      ¿Ya tienes una cuenta? <a routerLink="/login" style="color: #4f46e5; text-decoration: none; font-weight: 600;">Inicia Sesión</a>
    </p>
  </form>
</section>
